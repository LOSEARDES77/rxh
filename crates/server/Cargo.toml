[package]
name = "rxh-server"
description = "Runtime of the RXH proxy: HTTP reverse proxy, TCP/UDP load balancer, health checks and admin API"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["reverse-proxy", "load-balancer", "tcp-proxy", "udp-proxy", "http"]
categories = ["network-programming", "web-programming::http-server"]

[features]
# Exposes internal parsers to the fuzz targets in `fuzz/`. Not a stable API.
fuzzing = []

[dependencies]
async-compression.workspace = true
aws-lc-rs.workspace = true
base64.workspace = true
bytes.workspace = true
http.workspace = true
http-body-util.workspace = true
h3.workspace = true
h3-quinn.workspace = true
hickory-resolver.workspace = true
hmac.workspace = true
httpdate.workspace = true
hyper.workspace = true
hyper-util.workspace = true
instant-acme.workspace = true
quinn.workspace = true
rcgen.workspace = true
regex.workspace = true
rxh-core.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
socket2.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
toml.workspace = true
webpki-roots.workspace = true
x509-parser.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[dev-dependencies]
bcrypt.workspace = true
rxh-test-util = { path = "../util" }
tempfile.workspace = true

[lints]
workspace = true
