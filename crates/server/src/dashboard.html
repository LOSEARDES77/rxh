<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rxh dashboard</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9; --panel: #fff; --line: #dfe3e8; --text: #1c2430; --dim: #5d6b7c;
    --ok: #17803d; --warn: #a15c00; --bad: #c0271e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161c; --panel: #1a2029; --line: #2c3541; --text: #e4e9ef; --dim: #93a1b3;
      --ok: #4cc47a; --warn: #e5a443; --bad: #f2766d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 1.5rem; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, sans-serif;
  }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: .4rem 1.5rem; }
  h1 { margin: 0; font-size: 1.3rem; }
  h2 { margin: 1.6rem 0 .5rem; font-size: 1rem; }
  #summary, #updated { color: var(--dim); }
  #updated { margin-left: auto; }
  #problem { margin: 1rem 0 0; padding: .6rem .8rem; border: 1px solid var(--bad); border-radius: 6px; color: var(--bad); }
  .scroll { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: .45rem .8rem; text-align: left; vertical-align: top; white-space: nowrap; }
  th { color: var(--dim); font-weight: 600; border-bottom: 1px solid var(--line); }
  tr + tr td { border-top: 1px solid var(--line); }
  td.wrap { white-space: normal; }
  td.number, th.number { text-align: right; font-variant-numeric: tabular-nums; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  .ok, .warn, .bad { font-weight: 600; }
  .empty { color: var(--dim); }
  form { margin-top: 1rem; display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
  input, button { font: inherit; padding: .35rem .6rem; }
  [hidden] { display: none; }
</style>
</head>
<body>
<header>
  <h1>rxh</h1>
  <span id="summary"></span>
  <span id="updated" role="status"></span>
</header>
<p id="problem" role="alert" hidden></p>
<form id="login" hidden>
  <label for="token">Admin token</label>
  <input id="token" type="password" autocomplete="off" required>
  <button>Show</button>
</form>
<main id="data" hidden>
  <h2>Listeners</h2>
  <div class="scroll"><table id="listeners">
    <thead><tr><th>Address</th><th>Protocol</th><th>Name</th><th>State</th></tr></thead>
    <tbody></tbody>
  </table></div>

  <h2>Hosts</h2>
  <div class="scroll"><table id="hosts">
    <thead><tr><th>Server</th><th>Hosts</th><th>Listen</th><th>Protocol</th><th>Routes</th></tr></thead>
    <tbody></tbody>
  </table></div>

  <h2>Health</h2>
  <div class="scroll"><table id="pools">
    <thead><tr><th>Pool</th><th>Policy</th><th>Backend</th><th>Health</th>
      <th class="number">Weight</th><th class="number">In flight</th>
      <th class="number">Requests</th><th class="number">Fails</th></tr></thead>
    <tbody></tbody>
  </table></div>

  <h2>Certificates</h2>
  <div class="scroll"><table id="certificates">
    <thead><tr><th>Names</th><th>Listener</th><th>Source</th><th>Issuer</th><th>Expires</th>
      <th>Left</th><th>OCSP</th></tr></thead>
    <tbody></tbody>
  </table></div>
</main>
<script>
"use strict";
// Read only: this page sends GET requests and nothing else. Everything the
// API returns is written with textContent, never as HTML.
const REFRESH_MS = 2000;
const $ = (id) => document.getElementById(id);

// A cell is a string, or [text, class].
function fill(id, rows, none) {
  const table = $(id);
  const body = table.tBodies[0];
  body.replaceChildren();
  if (!rows.length) {
    const td = body.insertRow().insertCell();
    td.colSpan = table.tHead.rows[0].cells.length;
    td.className = "empty";
    td.textContent = none;
  }
  for (const cells of rows) {
    const tr = body.insertRow();
    for (const value of cells) {
      const [text, style] = Array.isArray(value) ? value : [value, ""];
      const td = tr.insertCell();
      td.textContent = text ?? "";
      td.className = style;
    }
  }
}

function uptime(seconds) {
  const days = Math.floor(seconds / 86400);
  const hours = Math.floor(seconds % 86400 / 3600);
  const minutes = Math.floor(seconds % 3600 / 60);
  if (days) return `${days}d ${hours}h`;
  if (hours) return `${hours}h ${minutes}m`;
  return minutes ? `${minutes}m ${seconds % 60}s` : `${seconds}s`;
}

function target(route) {
  const forward = route.forward;
  if (typeof forward === "string") return forward;
  if (Array.isArray(forward)) return forward.map((part) => `${part.pool} (${part.weight})`).join(", ");
  if (forward) return (forward.backends ?? []).map((backend) => backend.address ?? backend).join(", ");
  if (route.serve) return `files ${route.serve.root ?? route.serve}`;
  if (route.redirect) return `redirect ${route.redirect.to ?? route.redirect}`;
  if (route.subroute) return `${route.subroute.length} subroutes`;
  return "";
}

function hostRows(config) {
  return (config.server ?? []).map((server, index) => {
    const routes = server.match ?? [];
    const hosts = new Set([...(server.host ?? []), ...routes.flatMap((route) => route.host ?? [])]);
    return [
      server.name ?? `#${index}`,
      [[...hosts].join(", ") || "any", "wrap"],
      [server.listen ?? []].flat().join(", "),
      server.tls ? `${server.protocol} + tls` : server.protocol,
      [routes.map((route) => `${route.uri ?? ""} → ${target(route)}`).join("; "), "wrap"],
    ];
  });
}

function health(upstream) {
  if (upstream.state !== "ready") return [upstream.state, "warn"];
  if (!upstream.healthy) return ["unhealthy", "bad"];
  return upstream.available ? ["healthy", "ok"] : ["unavailable", "warn"];
}

function poolRows(pools) {
  return pools.flatMap((pool) => {
    if (!pool.upstreams.length) {
      return [[pool.name, pool.policy, ["no backends", "bad"], "", "", "", "", ""]];
    }
    return pool.upstreams.map((upstream) => [
      pool.name,
      pool.policy,
      upstream.address,
      health(upstream),
      [upstream.weight, "number"],
      [upstream.num_requests, "number"],
      [upstream.total_requests, "number"],
      [upstream.fails, "number"],
    ]);
  });
}

function certificateRows(certificates) {
  return certificates.map((certificate) => {
    const days = certificate.days_left;
    const left = days < 0 ? ["expired", "bad"] : [`${days} days`, days <= 14 ? "warn" : "ok"];
    return [
      [(certificate.names ?? []).join(", ") || certificate.subject, "wrap"],
      certificate.listen,
      certificate.source,
      [certificate.issuer, "wrap"],
      (certificate.not_after ?? "").slice(0, 10),
      left,
      certificate.ocsp_stapled ? "stapled" : "no",
    ];
  });
}

async function api(path) {
  const token = sessionStorage.getItem("rxh-admin-token");
  const response = await fetch(path, {
    cache: "no-store",
    headers: token ? { Authorization: `Bearer ${token}` } : {},
  });
  if (response.status === 401) throw new Error("token");
  if (!response.ok) throw new Error(`GET ${path}: ${response.status}`);
  return response.json();
}

async function refresh() {
  try {
    const [status, config, certificates] = await Promise.all([
      api("status"), api("config"), api("certificates"),
    ]);
    $("summary").textContent =
      `${status.version} · pid ${status.pid} · up ${uptime(status.uptime_seconds)}` +
      (status.config_path ? ` · ${status.config_path}` : "");
    fill("listeners", status.servers.map((server) => [
      server.listen, server.protocol, server.name ?? "",
      [server.state, server.state === "listening" ? "ok" : "warn"],
    ]), "No listeners.");
    fill("hosts", hostRows(config), "No servers.");
    fill("pools", poolRows(status.pools), "No pools.");
    fill("certificates", certificateRows(certificates), "No certificates.");
    $("updated").textContent = `Updated ${new Date().toLocaleTimeString()}`;
    $("problem").hidden = true;
    $("login").hidden = true;
    $("data").hidden = false;
  } catch (err) {
    const needsToken = err.message === "token";
    $("login").hidden = !needsToken;
    if (needsToken) $("data").hidden = true;
    $("problem").textContent = needsToken
      ? "The admin API requires its token."
      : `The admin API does not answer (${err.message}). Retrying.`;
    $("problem").hidden = false;
  }
  // Without a token there is nothing to retry until the form is sent.
  if ($("login").hidden) setTimeout(refresh, REFRESH_MS);
}

$("login").addEventListener("submit", (event) => {
  event.preventDefault();
  sessionStorage.setItem("rxh-admin-token", $("token").value);
  $("token").value = "";
  $("login").hidden = true;
  refresh();
});

refresh();
</script>
</body>
</html>
