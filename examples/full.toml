# Every RXH option with its default value or an example. Values in comments
# are defaults. Durations accept ns, us, ms, s, m, h, d ("1m30s") or seconds.

# Time open connections get to finish on stop/reload. Unset waits forever.
# Top level keys must come before the first [table].
grace_period = "30s"

# Admin API, used by the `rxh` CLI. No authentication: keep it on loopback.
[admin]
enabled = true                 # default true
listen = "127.0.0.1:2019"      # default, same as Caddy

# Access logs. Metrics are served at http://127.0.0.1:2019/metrics.
[log]
format = "text"                # default; "json" writes one JSON object per line
output = "stdout"              # default; "stderr" or a file path (appended)
access = true                  # default; false disables access lines

# Named load balancing group, referenced as "@api".
[upstream.api]
policy = "least_conn"          # random | random_choose | first | round_robin |
                               # weighted_round_robin (default) | least_conn |
                               # ip_hash | client_ip_hash | uri_hash | query |
                               # header | cookie
# choose = 2                   # random_choose sample size
# key = "x-user"               # query/header/cookie name (cookie default "lb")
# secret = "change-me"         # cookie HMAC secret
# fallback = "random"          # used when the hash key is missing
# fallback = { policy = "query", key = "user", fallback = "round_robin" }  # nested
# retry_match = { method = ["GET", "POST"], status = ["502", "5xx"] }  # lb_retry_match
retries = 2                    # extra attempts after a failure (lb_retries)
# try_duration = "5s"          # keep retrying this long (lb_try_duration)
try_interval = "250ms"         # wait between attempts (lb_try_interval)
dial_timeout = "3s"
# response_header_timeout = "30s"  # 504 when the backend sends no headers in time
# read_timeout = "1m"              # upstream read without progress fails
# write_timeout = "1m"             # upstream write without progress fails
keepalive = "2m"               # idle upstream connection lifetime
keepalive_idle_conns_per_host = 32
h2c = false                    # cleartext HTTP/2 to backends
backends = [
    "127.0.0.1:8080",
    { address = "127.0.0.1:8081", weight = 3 },
    "127.0.0.1:9001-9003",     # port range
]

# Backends over TLS. Other address forms: "http://host[:port]" and
# "unix//run/app.sock". A pool cannot mix https:// and plain backends.
[upstream.secure]
backends = ["https://secure.internal", "https://other.internal:8443"]

[upstream.secure.tls]
# server_name = "secure.internal"   # SNI override, default the backend host
insecure_skip_verify = false
ca = "/etc/rxh/ca.pem"              # extra trusted roots on top of webpki-roots
client_cert = "/etc/rxh/client.pem" # mutual TLS
client_key = "/etc/rxh/client.key"

# Members from DNS on top of `backends`: `a = "name:port"` (A/AAAA records) or
# `srv = "_service._proto.name"`. With TLS and `a`, `tls.server_name` is required.
[upstream.discovered]
backends = []
dynamic = { a = "app.internal:8080", refresh = "30s", versions = ["ipv4", "ipv6"] }
# dynamic = { srv = "_http._tcp.app.internal", resolvers = ["10.0.0.53:53"] }

# Active health checks. Without `uri` they are TCP connect checks.
[upstream.api.health]
uri = "/health"
# port = 9000                  # check another port of each backend
# upstream = "10.0.0.9:9000"   # check one fixed address instead
interval = "10s"               # default 30s
timeout = "2s"                 # default 5s
passes = 1
fails = 2
method = "GET"
status = "2xx"                 # or a code like 200
body = "ok"                    # regular expression
headers = { Host = "api.internal" }
# request_body = ""
# follow_redirects = false

# Passive health checks, based on real traffic.
[upstream.api.passive]
fail_duration = "30s"
max_fails = 3
unhealthy_status = ["5xx"]
unhealthy_latency = "2s"
unhealthy_request_count = 500  # concurrent requests per backend, 0 = no limit

# Virtual host: "blog" and "edge" below list the same addresses, so they share
# one socket. Routes are tried in file order, so this host-bound site comes
# before the catch-all routes of "edge". With TLS, each server would have its
# own `tls` and the certificate would be picked by SNI.

[[server]]

name = "blog"
listen = ["0.0.0.0:8100", "[::]:8100"]
host = ["blog.example.com", "*.blog.example.com"]
forward = "@api"

# HTTP server with several routes.
[[server]]
name = "edge"
listen = ["0.0.0.0:8100", "[::]:8100"]
max_connections = 1024
http2 = true
read_header_timeout = "10s"    # clients must send request headers in time
idle_timeout = "2m"            # close idle keep-alive connections
stream_timeout = "1h"          # maximum lifetime of WebSocket tunnels
trusted_proxies = ["private_ranges", "203.0.113.0/24"]
# tls = { cert = "/etc/rxh/cert.pem", key = "/etc/rxh/key.pem" }

[[server.match]]
uri = "/api"
forward = "@api"
request.headers.forwarded = { extend = true, by = "edge" }
request.headers.set = { "x-proxied-by" = "rxh" }
request.headers.remove = ["x-debug", "x-internal-*"]
request.headers.add = { "x-extra" = "1" }
request.headers.replace = { "x-path" = { search = "^/v1/(.*)$", replace = "/v2/$1" } }
response.headers.via = { extend = true }
response.headers.server = { override = true, version = false }
response.headers.remove = ["x-powered-by"]
response.headers.add = { "x-served-by" = "rxh" }
cache = { enabled = true, ttl_seconds = 30, max_entries = 1024, max_body_bytes = 1048576 }

# Matchers are ANDed: host, path, method, header, query and remote_ip.
[[server.match]]
host = ["admin.example.com", "*.internal.example.com"]
path = ["/admin/*", "*.php"]
method = ["GET", "POST"]
header = { "x-env" = "prod", "authorization" = "*" }
query = { "debug" = "*" }
remote_ip = ["10.0.0.0/8", "::1/128"]
forward = "@api"

[[server.match]]
uri = "/"
serve = "/var/www"

# TCP (layer 4) with PROXY protocol and an inline group.
[[server]]
name = "postgres"
listen = "0.0.0.0:5432"
protocol = "tcp"
idle_timeout = "10m"           # no traffic in either direction
stream_timeout = "12h"         # maximum connection lifetime
proxy_protocol = "v2"
forward = { policy = "first", backends = ["10.0.0.1:5432", "10.0.0.2:5432"], health = { interval = "5s" } }

# UDP (layer 4), one session per client address.
[[server]]
name = "dns"
listen = "0.0.0.0:5353"
protocol = "udp"
udp_idle_timeout = "30s"
forward = { policy = "ip_hash", backends = ["10.0.0.53:53", "10.0.0.54:53"] }
