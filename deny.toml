# Policy checked by `cargo deny check` in CI (the `deny` job).

[graph]
all-features = true

[advisories]
# Vulnerabilities and unsound crates always fail; so do unmaintained and
# yanked crates anywhere in the graph. An exception goes to `ignore` with
# the advisory ID and a reason.
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses compatible with distributing RXH under MIT.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions come from upstream crates (windows-sys, getrandom, syn):
# reported, not fatal.
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between workspace crates carry no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
