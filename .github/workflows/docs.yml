name: Docs

# Builds the documentation site (mdBook, `docs/book.toml`) on every pull
# request, and publishes it to GitHub Pages from master.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: mdbook build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook
      - run: mdbook build docs
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/book

  deploy:
    name: publish to GitHub Pages
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
