name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  ui:
    name: web UI (check, test, build, committed dist)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/server/ui
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run build
      # The Rust binary embeds `dist/`: it must be the build of the sources.
      # `git status` also lists new files that were never committed.
      - run: test -z "$(git status --porcelain -- dist)" || { git status --porcelain -- dist; exit 1; }
      - run: bun audit

  coverage:
    name: line coverage (85% or more, without crates/bench)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      # The benchmark tool is not shipped and is exercised by bench-gate; it stays out of the gate.
      - run: >-
          cargo llvm-cov --workspace
          --ignore-filename-regex 'crates/bench/'
          --summary-only
          --fail-under-lines 85

  fuzz:
    name: fuzz targets (60 seconds each)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Run every target
        working-directory: fuzz
        run: |
          mkdir -p corpus/config
          cp ../examples/*.toml ../examples/includes/*.toml corpus/config/
          for target in $(cargo +nightly fuzz list); do
            cargo +nightly fuzz run "$target" -- -max_total_time=60
          done

  bench-gate:
    name: rxh-bench --quick (gates on RXH, Caddy for information)
    runs-on: ubuntu-latest
    # The exit code reflects RXH only: a FAIL or n/a of RXH fails the job, Caddy
    # results are printed for information. Speed is never part of a verdict.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p rxh-cli -p rxh-bench
      - run: ./target/release/rxh-bench --quick --caddy-docker
