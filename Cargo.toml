[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
authors = ["Antonio Sarosi", "LOSEARDES77"]
repository = "https://github.com/LOSEARDES77/rxh"
rust-version = "1.100"

[workspace.dependencies]
rxh-core = { path = "crates/core", version = "0.3.0" }
rxh-server = { path = "crates/server", version = "0.3.0" }

async-compression = { version = "0.4.52", features = ["tokio", "gzip", "zstd", "brotli"] }
base64 = "0.22.1"
aws-lc-rs = { version = "1.19.0", default-features = false, features = ["aws-lc-sys"] }
bcrypt = "0.19.3"
bytes = "1.12.2"
clap = { version = "4.6.8", features = ["derive", "env"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
hickory-resolver = "0.26.3"
hmac = "0.13.0"
http = "1.5.0"
http-body-util = "0.1.5"
httpdate = "1.0.3"
hyper = { version = "1.12.0", features = ["full"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server-auto", "http1", "http2"] }
instant-acme = { version = "0.8.5", features = ["rcgen"] }
libc = "0.2.191"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
rcgen = "0.14.10"
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = "0.26.6"
toml = "1.2.1"
toml_edit = "0.25.19"
webpki-roots = "1.0.11"
x509-parser = "0.18.1"

[workspace.lints.clippy]
unwrap_used = "warn"
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
