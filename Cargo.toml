[package]
name = "rxh"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
description = "HTTP reverse proxy & load balancer"
repository = "https://github.com/antoniosarosi/rxh"
readme = "README.md"
keywords = ["reverse", "proxy", "http"]
categories = ["web-programming::http-server", "network-programming"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "1.50.0", features = ["full"] }
hyper = { version = "1.8.1", features = ["full"] }
http-body-util = "0.1.3"
bytes = "1.11.1"
http = "1.4.0"
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.9.8"
hyper-util = { version = "0.1.20", features = ["tokio", "server-auto", "client", "client-legacy", "http1", "http2"] }
tokio-rustls = "0.26.4"
rustls-pemfile = "2.2.0"
daemonize = "0.5.0"
clap = { version = "4.5.40", features = ["derive"] }
libc = "0.2.177"
minify-html = "0.18.1"

[build-dependencies]
minify-html = "0.18.1"

[dev-dependencies]
rcgen = "0.14"
tempfile = "3.27.0"
